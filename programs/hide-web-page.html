<!DOCTYPE html>
<html>
 <!--
     hide-web-page.html/version 1.
     --------------------------------------------- 
     This page relies on...
     1. The Javascript framework library: JQuery.
     2. Having an 'internet connection' available to download the 'external' JQuery file.
       -(Alternatively, one could save the JQuery file to be accessed 'locally', instead.)-
     --------------------------------------------
     It's operation is very straight forwards and simple:
 
     Press key: 'h', to hide the web page content.
     Press key: 's', to show the web page content.
     ---------------------------------------------
     NOTE:-
 
     A super savvy person might wonder to themselves what the hell is going on here...;
     why is this person staring at a totally 'blank' web page for...;
     what, indeed, is so very highly fascinating about that...?!
     So, this might arise their suspicion to go check out seeing what is the code behind the page...

     In that case, it may just be far better to send the person off to
     go visit seeing a totally 'innocent' next web page/or, web site;
     such as a search engine: google/yahoo/-etc.;
     and, in that way far less suspicion might be aroused.
 -->
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="page-created" content="Sun 9 Aug 2026 09:43 AM GMT">
  <title>JQuery: Hide/Show web page</title>
  <style>
   header,footer{text-align:center;}
   .clsPara{text-indent:1cm;}
   .clsDateTimeStamp{color:red;font-style:italic;}
  </style>
 </head>
 <body>
  <!-- Container wrapper -->
  <div id="wrapper">
   <header>
    <h1>YourName web page</h1>
   </header>
   <main>
    <h3>Introduction</h3>
    <p class="clsPara">Welcome to my web page.</p>
   </main>
   <footer>
    <p class="clsPara">
     Document last modified:
     <br>
     <span class="clsDateTimeStamp">
      Thu 13 Aug 2026 06:34 AM GMT
     </span>
    </p>
   </footer>
  </div>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script>
    function hideContent(){ $("#wrapper").hide(); }
    function showContent(){ $("#wrapper").show(); }
    document.addEventListener('keydown', (event) => {
     const key = event.key.toLowerCase();
     if (key === 'h') { hideContent(); }
     if (key === 's') { showContent(); }
    });
  </script>
 </body>
</html>
